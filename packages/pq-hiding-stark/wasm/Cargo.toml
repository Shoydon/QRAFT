[package]
publish=false
name="himitsu-hiding-wasm-feasibility"
version="0.0.0"
edition="2024"
[lib]
crate-type=["cdylib"]
[dependencies]
himitsu-direct-hiding-research={path=".."}
p3-field={path="../vendor/plonky3/field"}
p3-uni-stark={path="../vendor/plonky3/uni-stark"}
p3-merkle-tree={path="../vendor/plonky3/merkle-tree"}
p3-dft={path="../vendor/plonky3/dft"}
p3-commit={path="../vendor/plonky3/commit"}
p3-challenger={path="../vendor/plonky3/challenger"}
serde={version="1",features=["derive"]}
serde_json="1"
postcard={version="1.1.3",features=["alloc"]}
rand="0.10.1"
getrandom={version="0.4",features=["wasm_js"]}
wasm-bindgen="=0.2.127"
[profile.release]
opt-level=3
lto="thin"
